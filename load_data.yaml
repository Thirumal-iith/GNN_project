name: Load Elliptic Bitcoin Dataset
description: Loads the EllipticBitcoinDataset and saves it as a PyTorch `.pt` data file.

outputs:
  - name: outputpath1
    type: Path
    description: Path to save the output `.pt` file

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        # Install dependencies
        python3 -m pip install --quiet --no-cache-dir torch torch_geometric

        # Run the Python script
        python3 -u - "$@" <<'PYCODE'
        import torch
        from torch_geometric.datasets import EllipticBitcoinDataset
        import argparse
        import os

        parser = argparse.ArgumentParser()
        parser.add_argument('--outputpath1', type=str, required=True)
        args = parser.parse_args()

        # Load dataset
        dataset = EllipticBitcoinDataset(root='/tmp/elliptic')
        data = dataset[0]

        # Ensure output directory exists
        outdir = os.path.dirname(args.outputpath1)
        if outdir:
            os.makedirs(outdir, exist_ok=True)

        # Save dataset
        torch.save(data, args.outputpath1)
        print(f"✅ Saved raw data to {args.outputpath1}")
        PYCODE
      - --
    args:
      - --outputpath1
      - {outputPath: outputpath1}
