name: Load Elliptic Bitcoin Dataset
description: Loads the EllipticBitcoinDataset and saves as a PyTorch data file.

outputs:
  - {
      name: output_path,
      type: String,
      description: "Output .pt file path",
      path: "{output_path}"
    }

implementation:
  container:
    image: python:3.9
    command:
      - python
      - -u
      - -c
      - |
        import torch
        from torch_geometric.datasets import EllipticBitcoinDataset
        import argparse
        import os

        parser = argparse.ArgumentParser()
        parser.add_argument('--output_path', type=str, required=True)
        args = parser.parse_args()

        root_path = '/tmp/elliptic'  # Use a guaranteed writable directory!
        os.makedirs(root_path, exist_ok=True)
        # Make sure output directory exists
        outdir = os.path.dirname(args.output_path)
        if outdir:
            os.makedirs(outdir, exist_ok=True)

        dataset = EllipticBitcoinDataset(root=root_path)
        data = dataset[0]
        torch.save(data, args.output_path)
        print(f"Saved raw data to {args.output_path}")

    args:
      - --output_path
      - {outputPath: output_path}