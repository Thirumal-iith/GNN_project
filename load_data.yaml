name: Load Elliptic Bitcoin Dataset
description: Loads the EllipticBitcoinDataset and saves as a PyTorch data file.

outputs:
  - name: outputpath1
    type: String
    description: Output .pt file path

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        # Install dependencies
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric --user
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch --user

        # Run the Python script
        python3 -u - --outputpath1 "$0" <<'PYCODE'
        import torch
        from torch_geometric.datasets import EllipticBitcoinDataset
        import argparse
        import os

        parser = argparse.ArgumentParser()
        parser.add_argument('--outputpath1', type=str, required=True)
        args = parser.parse_args()

        dataset = EllipticBitcoinDataset(root='/tmp/elliptic')
        data = dataset[0]

        outdir = os.path.dirname(args.outputpath1)
        if outdir:
            os.makedirs(outdir, exist_ok=True)

        torch.save(data, args.outputpath1)
        print(f"Saved raw data to {args.outputpath1}")
        PYCODE
      - {outputPath: outputpath1}
