name: Build GCN Model
description: Defines and saves a GCN model (PyTorch) with 4 hidden layers and dropout.

inputs:
  - {name: weights, type: Json, description: "Class/focal weights as JSON"}
  - {name: config_file, type: Json, description: "GCN model configuration as JSON"}

outputs:
  - {name: gcn_model, type: Model, description: "Serialized GCN model"}
  - {name: updated_config, type: Json, description: "Updated model configuration as JSON", path: "{updated_config}"}

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric --user
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import os
        import json
        import torch
        import torch.nn as nn
        import torch.nn.functional as F
        from torch_geometric.nn import GCNConv

        # Read weights and config
        with open('{inputPath: weights}') as wf:
            weights = json.load(wf)
        with open('{inputPath: config_file}') as cf:
            config = json.load(cf)

        # Fill in defaults if needed
        input_dim = config.get('input_dim', 128)
        hidden_dims = config.get('hidden_dims', [64, 64, 32, 32])
        output_dim = config.get('output_dim', 3)
        dropout_rate = config.get('dropout_rate', 0.5)

        class GCNModel(nn.Module):
            def __init__(self, input_dim, hidden_dims, output_dim, dropout_rate):
                super(GCNModel, self).__init__()
                dims = [input_dim] + hidden_dims + [output_dim]
                self.convs = nn.ModuleList()
                self.dropouts = nn.ModuleList()
                for i in range(len(dims) - 2):
                    self.convs.append(GCNConv(dims[i], dims[i+1]))
                    self.dropouts.append(nn.Dropout(p=dropout_rate))
                self.final_conv = GCNConv(dims[-2], dims[-1])

            def forward(self, x, edge_index):
                for conv, dropout in zip(self.convs, self.dropouts):
                    x = conv(x, edge_index)
                    x = F.relu(x)
                    x = dropout(x)
                x = self.final_conv(x, edge_index)
                return x

        # Add weights to config if needed
        config['focal_loss_alpha'] = weights.get('focal_loss_alpha', None)
        config['class_weights'] = weights.get('class_weights', None)

        # Save updated config
        with open('{outputPath: updated_config}', 'w') as uf:
            json.dump(config, uf)

        # Instantiate and save model
        model = GCNModel(input_dim, hidden_dims, output_dim, dropout_rate)
        gcn_model_path = '{outputPath: gcn_model}'
        os.makedirs(os.path.dirname(gcn_model_path) or '.', exist_ok=True)
        torch.save(model.state_dict(), gcn_model_path)
        print(f"Model saved to {gcn_model_path}")
        print(f"Updated config saved to {os.path.abspath('{outputPath: updated_config}')}")
    args:
      - --weights
      - {inputPath: weights}
      - --config_file
      - {inputPath: config_file}
      - --gcn_model
      - {outputPath: gcn_model}
      - --updated_config
      - {outputPath: updated_config}