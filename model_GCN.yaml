name: Build Model
description: Instantiates a model using create_model from the NeSy-Factory-Models GitHub repo and saves it.

inputs:
  - { name: config_path, type: String, description: "Path to model config JSON file" }
  - { name: model_name, type: String, description: "Name of the model to instantiate (e.g., tgcn, ffnetwork)" }

outputs:
  - { name: model_out, type: Model, description: "Path to save the model weights", path: "{model_out}" }

implementation:
  container:
    image: python:3.10
    command:
      - sh
      - -c
      - |
        # Upgrade pip and install dependencies
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet pip --upgrade

        # Install PyTorch with CUDA 11.8 (change +cu118 to +cpu if you do not have GPU support)
        python3 -m pip install --quiet torch==2.0.1+cu118 torchvision==0.15.2+cu118 torchaudio==2.0.2+cu118 -f https://download.pytorch.org/whl/torch_stable.html

        # Install PyG extensions
        python3 -m pip install --quiet torch-scatter torch-sparse torch-cluster torch-spline-conv -f https://data.pyg.org/whl/torch-2.0.1+cu118.html

        # Install scikit-learn for compatibility
        python3 -m pip install --quiet scikit-learn

        # Install your custom factory library
        python3 -m pip install --quiet \
          "git+https://naga-mobius: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@github.com/gaiangroup/NeSy-Factory-Models.git#egg=nesy-factory-models[geometric,temporal]"

        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import torch
        import json
        import argparse
        import os

        # Import directly from your pip-installed library
        from nesy_factory_models.GNNs import create_model

        parser = argparse.ArgumentParser()
        parser.add_argument('--config_path', type=str, required=True)
        parser.add_argument('--model_name', type=str, required=True)
        parser.add_argument('--model_out', type=str, required=True)
        args = parser.parse_args()

        # Load config from JSON file
        with open(args.config_path) as f:
            config = json.load(f)

        # Instantiate model using factory
        model = create_model(args.model_name, config)

        # Ensure output directory exists
        os.makedirs(os.path.dirname(args.model_out), exist_ok=True)

        # Save model state dict
        torch.save(model.state_dict(), args.model_out)
        print(f"Model saved to {args.model_out}")

    args:
      - --config_path
      - {inputValue: config_path}
      - --model_name
      - {inputValue: model_name}
      - --model_out
      - {outputPath: model_out}
