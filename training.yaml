name: Train TGCN Model with Dynamic Import
description: Loads data & config, dynamically imports TGCN model, trains, and saves trained weights.

inputs:
  - {name: data_path, type: String}          # path to processed data .pt
  - {name: model_path, type: String}         # path to tgcn_model.py file
  - {name: config_path, type: String}        # config JSON file

outputs:
  - {name: model_out, type: Model}           # saved trained model weights

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch --user
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import torch
        import argparse
        import importlib.util
        import os
        import json

        def dynamic_import(model_path, class_name='TGCN'):
            """Dynamically import the TGCN model class from the given Python file."""
            spec = importlib.util.spec_from_file_location("tgcn_module", model_path)
            tgcn_module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(tgcn_module)
            return getattr(tgcn_module, class_name)

        parser = argparse.ArgumentParser()
        parser.add_argument('--data_path', type=str, required=True)
        parser.add_argument('--model_path', type=str, required=True)
        parser.add_argument('--config_path', type=str, required=True)
        parser.add_argument('--model_out', type=str, required=True)
        args = parser.parse_args()

        os.makedirs(os.path.dirname(args.model_out), exist_ok=True)

        data = torch.load(args.data_path)

        with open(args.config_path) as f:
            config = json.load(f)

        TGCN = dynamic_import(args.model_path, class_name='TGCN')

        model = TGCN(config)

        print("Starting training...")
        for epoch in range(config.get('epochs', 50)):
            loss = model.train_step(data, data.train_mask)
            if epoch % 10 == 0:
                print(f"Epoch {epoch:03d} | Loss: {loss:.4f}")

        torch.save(model.state_dict(), args.model_out)
        print(f"Saved trained model to {args.model_out}")

    args:
      - --data_path
      - {inputValue: data_path}
      - --model_path
      - {inputValue: model_path}
      - --config_path
      - {inputValue: config_path}
      - --model_out
      - {outputPath: model_out}
