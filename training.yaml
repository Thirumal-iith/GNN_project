name: Train TGCN Model with Dynamic Import
description: Loads data & config, dynamically imports TGCN model, trains, and saves trained weights.

inputs:
  - {name: data_path, type: String, description: "Processed data .pt file (from load_data brick)"}
  - {name: config_file, type: Json, description: "Config JSON file (from build_model brick)"}
  - {name: model_path, type: Model, description: "Python file defining TGCN model (from build_model brick)"}

outputs:
  - {name: train_model, type: Model, description: "Trained model weights", path: "{train_model}"}

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch --user
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import torch
        import argparse
        import importlib.util
        import os
        import json

        def dynamic_import(model_path, class_name='TGCN'):
            spec = importlib.util.spec_from_file_location("tgcn_module", model_path)
            tgcn_module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(tgcn_module)
            return getattr(tgcn_module, class_name)

        parser = argparse.ArgumentParser()
        parser.add_argument('--data_path', type=str, required=True)
        parser.add_argument('--config_file', type=str, required=True)
        parser.add_argument('--model_path', type=str, required=True)
        parser.add_argument('--train_model', type=str, required=True)
        args = parser.parse_args()

        os.makedirs(os.path.dirname(args.train_model), exist_ok=True)

        data = torch.load(args.data_path)
        with open(args.config_file) as f:
            config = json.load(f)
        TGCN = dynamic_import(args.model_path, class_name='TGCN')
        model = TGCN(config)

        print("Starting training...")
        for epoch in range(config.get('epochs', 50)):
            loss = model.train_step(data, data.train_mask)
            if epoch % 10 == 0:
                print(f"Epoch {epoch:03d} | Loss: {loss:.4f}")

        torch.save(model.state_dict(), args.train_model)
        print(f"Saved trained model to {args.train_model}")

    args:
      - --data_path
      - {inputValue: data_path}
      - --config_file
      - {inputPath: config_file}
      - --model_path
      - {inputPath: model_path}
      - --train_model
      - {outputPath: train_model}