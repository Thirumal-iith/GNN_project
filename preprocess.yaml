name: Preprocess Elliptic Data
description: Analyzes class distribution and outputs alpha & class weights as JSON.

inputs:
  - name: input_pth
    type: String
outputs:
  - name: weights_out1
    type: String

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        set -e
        # Install dependencies
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch --user

        # Create a temporary Python script
        cat > /tmp/preprocess_script.py << 'SCRIPT_EOF'
        import torch
        import json
        import os
        import sys

        def analyze_class_distribution(data_dict):
            y = torch.tensor(data_dict["y"])
            train_mask = torch.tensor(data_dict["train_mask"], dtype=torch.bool)

            train_labels = y[train_mask]
            known_mask = train_labels != 2
            known_labels = train_labels[known_mask]

            licit_count = (known_labels == 0).sum().item()
            illicit_count = (known_labels == 1).sum().item()
            total_known = len(known_labels)
        
            ce_weight_licit = total_known / (2 * licit_count) if licit_count > 0 else 1
            ce_weight_illicit = total_known / (2 * illicit_count) if illicit_count > 0 else 1
            class_weights = [ce_weight_licit, ce_weight_illicit, 0.0]
        
            alpha_licit = illicit_count / total_known if total_known > 0 else 0.0
            alpha_illicit = licit_count / total_known if total_known > 0 else 0.0
            alpha_weights = [alpha_licit, alpha_illicit, 0.0]
        
            return alpha_weights, class_weights

        # Read arguments
        input_str = sys.argv[1]
        output_path = sys.argv[2]

        # Parse JSON string into Python dict
        data_dict = json.loads(input_str)

        # Ensure output directory exists
        out_dir = os.path.dirname(output_path)
        if out_dir:
            os.makedirs(out_dir, exist_ok=True)

        alpha_weights, class_weights = analyze_class_distribution(data_dict)

        weights_dict = {
            'focal_loss_alpha': alpha_weights,
            'class_weights': class_weights
        }
        with open(output_path, 'w') as f:
            json.dump(weights_dict, f)

        print(f"✅ Saved weights to {output_path}")
        SCRIPT_EOF

        # Run script
        python3 /tmp/preprocess_script.py "$0" "$1"
      - {inputValue: input_pth}
      - {outputPath: weights_out1}
