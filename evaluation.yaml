name: Evaluate Model
description: Evaluates the trained model and generates performance metrics.

inputs:
  - {name: trained_model, type: Model}
  - {name: data_pth, type: String}
  - {name: config, type: String}       # Changed from Json → String

outputs:
  - {name: metrics, type: Metrics}

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric scikit-learn || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric scikit-learn --user
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import torch
        import argparse
        import json
        from sklearn.metrics import classification_report

        # Parse arguments
        parser = argparse.ArgumentParser()
        parser.add_argument('--trained_model', type=str, required=True)
        parser.add_argument('--data', type=str, required=True)
        parser.add_argument('--config', type=str, required=True)  # JSON string
        parser.add_argument('--metrics', type=str, required=True)
        args = parser.parse_args()

        # Load inputs
        print("Loading trained model...")
        model = torch.load(args.trained_model)

        print("Loading data...")
        data = torch.load(args.data)

        print("Parsing config from string...")
        config = json.loads(args.config)

        # Model Evaluation
        eval_metrics = model.eval_step(data, data.test_mask)

        # Detailed Report
        model.eval()
        with torch.no_grad():
            out = model.predict(data)
            pred = out.argmax(dim=1)
            test_pred = pred[data.test_mask].cpu().numpy()
            test_true = data.y[data.test_mask].cpu().numpy()
            known_mask = test_true != 2
            test_pred_known = test_pred[known_mask]
            test_true_known = test_true[known_mask]
            report = classification_report(
                test_true_known,
                test_pred_known,
                target_names=['Licit', 'Illicit'],
                labels=[0, 1],
                digits=4,
                output_dict=True
            )

        # Prepare metrics output
        metrics_output = {
            'test_accuracy': eval_metrics['accuracy'],
            'classification_report': report,
            'test_predictions': test_pred_known.tolist(),
            'test_true_labels': test_true_known.tolist()
        }

        # Save metrics
        with open(args.metrics, 'w') as f:
            json.dump(metrics_output, f, indent=2)
    args:
      - --trained_model
      - {inputPath: trained_model}
      - --data
      - {inputPath: data_pth}
      - --config
      - {inputValue: config}      # Changed to inputValue so it's passed as a string
      - --metrics
      - {outputPath: metrics}
