name: Evaluate TGCN Model
description: Loads trained TGCN model and data, evaluates accuracy & metrics, saves as JSON report.

inputs:
  - {name: data_path, type: String, description: "Processed data .pt file (from load_data brick)"}
  - {name: config_file, type: Json, description: "Config JSON file (from build_model brick)"}
  - {name: model_path, type: Model, description: "Trained model weights (from training brick)"}

outputs:
  - {name: metrics_out, type: Metrics, description: "Evaluation metrics JSON report", path: "{metrics_out}"}

implementation:
  container:
    image: python:3.9
    command:
      - sh
      - -c
      - |
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric scikit-learn || \
        PIP_DISABLE_PIP_VERSION_CHECK=1 python3 -m pip install --quiet torch torch_geometric scikit-learn --user
        exec "$0" "$@"
      - python3
      - -u
      - -c
      - |
        import torch
        from tgcn_model import TGCN
        import argparse
        import json
        import os
        from sklearn.metrics import classification_report

        parser = argparse.ArgumentParser()
        parser.add_argument('--data_path', type=str, required=True)
        parser.add_argument('--config_file', type=str, required=True)
        parser.add_argument('--model_path', type=str, required=True)
        parser.add_argument('--metrics_out', type=str, required=True)
        args = parser.parse_args()

        os.makedirs(os.path.dirname(args.metrics_out), exist_ok=True)

        data = torch.load(args.data_path)
        with open(args.config_file) as f:
            config = json.load(f)

        model = TGCN(config)
        model.load_state_dict(torch.load(args.model_path))
        model.eval()

        with torch.no_grad():
            out = model.predict(data)
            pred = out.argmax(dim=1)
            test_pred = pred[data.test_mask].cpu().numpy()
            test_true = data.y[data.test_mask].cpu().numpy()
            known_mask = test_true != 2
            test_pred_known = test_pred[known_mask]
            test_true_known = test_true[known_mask]
            report = classification_report(
                test_true_known, test_pred_known,
                target_names=['Licit', 'Illicit'],
                digits=4, output_dict=True
            )
            print(report)

        with open(args.metrics_out, 'w') as f:
            json.dump(report, f)
        print(f"Saved evaluation metrics to {args.metrics_out}")

    args:
      - --data_path
      - {inputPath: data_path}
      - --config_file
      - {inputPath: config_file}
      - --model_path
      - {inputPath: model_path}
      - --metrics_out
      - {outputPath: metrics_out}